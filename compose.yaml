version: "3"
services:
  pwsh:
    build: .
    image: tririga-manage-ps1-dev
    platform: linux/amd64
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - "${SSH_AUTH_SOCK}:/run/ssh-agent.sock"
    environment:
      - SSH_AUTH_SOCK=/run/ssh-agent.sock
      - GH_TOKEN=${GH_TOKEN}
